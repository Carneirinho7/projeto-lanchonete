<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pedido - Lanchonete Dogão</title>
  </head>
  <body>
    <main class="pagina-comanda">
      <section class="pedido-cozinha" aria-labelledby="titulo-pedido">
        <div class="aviso-cozinha">Pedido em produção • Visão da cozinha</div>
        <div class="conteudo-pedido">
          <header class="cabecalho-pedido">
            <div><p>Pedido</p><h1 id="titulo-pedido">#001</h1></div>
            <div class="mesa"><span>Mesa</span><strong>03</strong></div>
          </header>
          <p class="horario">Horário: <strong>12:15</strong></p>
          <div class="itens-pedido">
            <p><strong>2x</strong> X-Burguer</p>
            <p><strong>1x</strong> Batata</p>
            <p><strong>2x</strong> Coca-Cola</p>
          </div>
          <div class="status-atual"><span>Status</span><strong>Preparando</strong></div>
          <ol class="status-pedido" aria-label="Andamento do pedido">
            <li class="concluido">Recebido</li><li class="ativo">Preparando</li><li>Pronto</li><li>Entregue</li>
          </ol>
        </div>
      </section>
    </main>
  </body>
</html>
